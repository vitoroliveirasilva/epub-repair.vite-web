version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    groups:
      frontend-tooling:
        patterns:
          - '@eslint/*'
          - 'typescript*'
          - vite
          - vitest
          - eslint
        update-types:
          - minor
          - patch
      epub-runtime:
        patterns:
          - jszip
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:30'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 3
