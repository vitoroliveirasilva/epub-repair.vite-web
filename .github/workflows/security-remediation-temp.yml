name: Security remediation (temporary)
on:
  push:
    branches:
      - fix/dev-dependency-security-and-epub-adversarial-tests
permissions:
  contents: write
jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
      - name: Audit original dependencies
        run: |
          npm audit --json > /tmp/npm-audit-before.json || true
          node -e 'const x=require("/tmp/npm-audit-before.json"); console.log("BEFORE", JSON.stringify(x.metadata?.vulnerabilities)); for(const [name,v] of Object.entries(x.vulnerabilities || {})) console.log(name, v.severity, "fixAvailable:",JSON.stringify(v.fixAvailable), "via:",v.via.filter(e=>typeof e!=="string").map(e=>({title:e.title,url:e.url,range:e.range})));'
      - name: Update compatible dependencies and install DOM test environment
        run: |
          npm update --package-lock-only --ignore-scripts --no-fund
          npm view vite version
          npm view vitest version
          npm view minimatch version
          npm view brace-expansion version
          npm view source-map-js version
      - name: Audit remediated dependencies
        run: |
          npm audit --json > /tmp/npm-audit-after.json || true
          node -e 'const x=require("/tmp/npm-audit-after.json"); console.log("AFTER", JSON.stringify(x.metadata?.vulnerabilities)); for(const [name,v] of Object.entries(x.vulnerabilities || {})) console.log(name, v.severity, "fixAvailable:",JSON.stringify(v.fixAvailable), "via:",v.via.filter(e=>typeof e!=="string").map(e=>({title:e.title,url:e.url,range:e.range})));'
      - name: Commit updated dependency lockfile to feature branch
        run: |
          git config user.name "Vitor Oliveira"
          git config user.email "114629454+vitoroliveirasilva@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(deps): corrigir advisories e preparar testes DOM"
            git push origin HEAD:fix/dev-dependency-security-and-epub-adversarial-tests
          fi
